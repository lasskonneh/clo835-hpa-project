apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 102783255-burn-hpa
  namespace: 102783255-hpa
  labels:
    app: 102783255-burn
    student-id: "102783255"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 102783255-burn
  minReplicas: 1
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

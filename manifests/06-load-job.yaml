apiVersion: batch/v1
kind: Job
metadata:
  name: 102783255-load
  namespace: 102783255-hpa
  labels:
    app: 102783255-load
    student-id: "102783255"
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: 102783255-load
        student-id: "102783255"
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O- http://102783255-burn-svc
              done
          resources:
            requests:
              cpu: "25m"
            limits:
              cpu: "100m"
